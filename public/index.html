<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>即庫系統</title>
  <meta name="description" content="店家端極速視覺與條碼商品掃描查詢、相機拍照即時建檔系統。" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json?v=354" />
  <link rel="stylesheet" href="/css/styles.css?v=354" />
</head>
<body>
  <!-- Merchant 2-Function Workspace: Optical Viewport directly at the top (Zero blocks above Optical Viewport) -->
  <main class="merchant-workspace" id="merchant-workspace">
    <!-- SECTION 1: Direct Top Optical Viewport (Visible ONLY on Scan Tab; Hidden on Inventory List & Edit/Registration Page) -->
    <section class="viewport-section" id="viewport-section" aria-label="光學取景區">
      <div class="viewport-container" id="viewport-container">
        <video id="camera-video" class="viewport-video hidden" playsinline muted autoplay></video>
        <canvas id="stage-canvas" class="viewport-canvas" width="640" height="480"></canvas>

        <!-- Optical HUD Overlay (Top-Left 3-State Status Badge + Centered ROI Target Reticle; Zero Flashlight Button) -->
        <div class="hud-overlay signal-amber" id="hud-overlay">
          <div class="hud-top-row">
            <div class="hud-status-badge state-standby" id="hud-live-badge" style="border-color:#f59f1f" aria-hidden="true">
              <span class="status-dot eco" id="hud-scan-dot" style="background-color:#f59f1f"></span>
              <span id="hud-live-label">待機中</span>
            </div>
          </div>

          <!-- ROI Target Reticle -->
          <div class="roi-reticle state-standby" id="roi-reticle">
            <span class="roi-corner tl" style="border-color:#f59f1f"></span>
            <span class="roi-corner tr" style="border-color:#f59f1f"></span>
            <span class="roi-corner bl" style="border-color:#f59f1f"></span>
            <span class="roi-corner br" style="border-color:#f59f1f"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION 2: Merchant Active View & Bottom Dock (左下角：掃描 | 中下：📸 拍照 | 右下角：庫存) -->
    <section class="merchant-main-panel" aria-label="掃描與庫存區">
      <!-- VIEW 1: 掃描 (If registered -> Show Product Card; If unregistered -> Blank middle area) -->
      <div id="view-scan" class="tab-view">
        <!-- Registered Product Information Card (左邊縮圖，右邊由上至下：品名、價格、存量、效期、成本) -->
        <div class="panel merchant-card hidden" id="recognized-product-card">
          <div class="panel-body">
            <div class="product-card-layout">
              <img id="rec-img" class="product-card-thumb" src="" alt="商品縮圖" />
              <div class="product-card-details">
                <div class="product-card-row">
                  <span class="product-card-label">品名</span>
                  <strong class="product-card-val name-val" id="rec-name">--</strong>
                </div>
                <div class="product-card-row">
                  <span class="product-card-label">價格</span>
                  <strong class="product-card-val price-val" id="rec-price">NT$ 0</strong>
                </div>
                <div class="product-card-row">
                  <span class="product-card-label">存量</span>
                  <strong class="product-card-val" id="rec-stock">0 件</strong>
                </div>
                <div class="product-card-row">
                  <span class="product-card-label">效期</span>
                  <strong class="product-card-val" id="rec-expiry">--</strong>
                </div>
                <div class="product-card-row">
                  <span class="product-card-label">成本</span>
                  <strong class="product-card-val mono" id="rec-cost">NT$ 0</strong>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Fixed Bottom Centered Capture Button (外框與顏色同左上角已建檔綠色提示標籤，與左右下角功能鍵互不遮擋) -->
        <div class="floating-capture-dock" id="floating-capture-dock">
          <button type="button" class="btn-capture-pill" id="btn-jump-register">
            📸 拍照
          </button>
        </div>
      </div>

      <!-- VIEW 2: 庫存 (僅顯示所有商品的商品卡：左邊產品縮圖，右邊由上至下依次為品名、價格、存量、效期、成本) -->
      <div id="view-register" class="tab-view hidden">
        <div id="inventory-cards-list" class="inventory-cards-list"></div>
      </div>

      <!-- VIEW 3: 獨立拍照建檔 / 編輯視圖 (僅由「📸 拍照」或點選商品卡編輯時開啟，不佔用「庫存」商品卡列表頁) -->
      <div id="view-form-modal" class="tab-view hidden">
        <div class="panel">
          <div class="panel-body">
            <!-- Captured Snapshot 1/3 Camera Preview + 2/3 Nine-Grid Thumbnails (上123 中456 下789) & Centered Capture Pill -->
            <div class="reg-capture-bar" id="reg-capture-bar">
              <div class="reg-camera-col" id="reg-camera-col">
                <div class="reg-camera-box">
                  <video id="reg-camera-video" class="reg-camera-video" playsinline muted autoplay></video>
                </div>
              </div>
              <div class="reg-grid-col" id="reg-grid-col">
                <div class="reg-photo-grid" id="reg-photo-grid" aria-label="商品縮圖九宮格">
                  <div class="reg-photo-slot focused" data-slot-index="0" id="reg-slot-0"><span class="reg-slot-num">1</span></div>
                  <div class="reg-photo-slot" data-slot-index="1" id="reg-slot-1"><span class="reg-slot-num">2</span></div>
                  <div class="reg-photo-slot" data-slot-index="2" id="reg-slot-2"><span class="reg-slot-num">3</span></div>
                  <div class="reg-photo-slot" data-slot-index="3" id="reg-slot-3"><span class="reg-slot-num">4</span></div>
                  <div class="reg-photo-slot" data-slot-index="4" id="reg-slot-4"><span class="reg-slot-num">5</span></div>
                  <div class="reg-photo-slot" data-slot-index="5" id="reg-slot-5"><span class="reg-slot-num">6</span></div>
                  <div class="reg-photo-slot" data-slot-index="6" id="reg-slot-6"><span class="reg-slot-num">7</span></div>
                  <div class="reg-photo-slot" data-slot-index="7" id="reg-slot-7"><span class="reg-slot-num">8</span></div>
                  <div class="reg-photo-slot" data-slot-index="8" id="reg-slot-8"><span class="reg-slot-num">9</span></div>
                  <div class="reg-photo-slot" data-slot-index="9" id="reg-slot-9"><span class="reg-slot-num">10</span></div>
                </div>
                <div class="reg-capture-actions">
                  <button type="button" class="btn-capture-pill" id="btn-capture-frame">
                    📸 拍照
                  </button>
                </div>
              </div>
            </div>

            <!-- Merchant Product Registration Form -->
            <form id="register-product-form" class="form-grid" novalidate>
              <input type="hidden" id="reg-id" value="" />

              <div class="form-field full">
                <label class="form-label" for="reg-name">品名 *</label>
                <input type="text" id="reg-name" class="input-control" placeholder="請輸入商品名稱（例如：阿里山高山烏龍茶 150g）" required />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-price">價格 (NT$) *</label>
                <input type="number" id="reg-price" class="input-control" placeholder="例如：350" value="" min="0" step="1" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-stock">存量 *</label>
                <input type="number" id="reg-stock" class="input-control" placeholder="例如：20" value="10" min="0" step="1" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-expiry">效期</label>
                <input type="text" id="reg-expiry" class="input-control" placeholder="例如：2027-12-31" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-cost">成本 (NT$)</label>
                <input type="number" id="reg-cost" class="input-control" placeholder="例如：200" value="" min="0" step="1" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-sku">商品編號 (SKU)</label>
                <input type="text" id="reg-sku" class="input-control" placeholder="留空自動編號或手動輸入" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-barcode">國際條碼 / QR Code</label>
                <input type="text" id="reg-barcode" class="input-control" placeholder="掃描自動帶入或手動輸入" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-category">商品分類</label>
                <input type="text" id="reg-category" class="input-control" placeholder="例如：飲品 / 零食 / 日用品" value="一般商品" />
              </div>

              <div class="form-field">
                <label class="form-label" for="reg-unit">單位 / 存放儲位</label>
                <div style="display:flex; gap:6px;">
                  <input type="text" id="reg-unit" class="input-control" placeholder="單位" value="件" style="width:68px;" />
                  <input type="text" id="reg-location" class="input-control" placeholder="儲位 (如 A-01)" value="A-01" style="flex:1;" />
                </div>
              </div>

              <div class="form-field full">
                <label class="form-label" for="reg-spec">商品介紹 / 規格備註</label>
                <textarea id="reg-spec" class="input-control" rows="2" placeholder="輸入規格、容量、產地、保存期限或店家備註..."></textarea>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Strictly 2 Corner Functions at Bottom:
           - 掃描/庫存頁：左下角「掃描」、右下角「庫存」，中央保留給「📸 拍照」互不遮擋
           - 商品編輯頁：左下角改為「取消」、右下角改為「存檔」，且需滑動到頁面最底部後才顯現 -->
      <nav class="merchant-tabs" id="merchant-bottom-nav" aria-label="店家功能切換">
        <button type="button" class="merchant-tab corner-left active" data-tab="scan" id="tab-btn-scan">
          <svg class="tab-icon scan-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span id="tab-label-scan">掃描</span>
        </button>
        <button type="button" class="merchant-tab corner-right" data-tab="register" id="tab-btn-register">
          <svg class="tab-icon inventory-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16.5 9.4 7.55 4.24"></path>
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.29 7 12 12 20.71 7"></polyline>
            <line x1="12" y1="22" x2="12" y2="12"></line>
          </svg>
          <span id="tab-label-register">庫存</span>
        </button>
      </nav>
    </section>
  </main>

  <!-- Product Card Long-Press 0.5s Context Menu (長按商品卡 0.5 秒叫出功能表：由上至下分別為 編輯、刪除) -->
  <div id="card-context-menu-backdrop" class="context-menu-backdrop hidden" role="presentation">
    <div id="card-context-menu" class="card-context-menu" role="menu" aria-label="商品卡功能表">
      <button type="button" class="context-menu-item" id="btn-ctx-edit" role="menuitem">編輯</button>
      <button type="button" class="context-menu-item danger" id="btn-ctx-delete" role="menuitem">刪除</button>
    </div>
  </div>

  <!-- Delete Product Confirmation Modal (點刪除後跳出確認框：確定刪除 品名(紅字表示) ?) -->
  <div id="delete-confirm-backdrop" class="context-menu-backdrop hidden" role="presentation">
    <div id="delete-confirm-modal" class="delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-text">
      <p class="delete-confirm-text" id="delete-confirm-text">
        確定刪除 <span class="delete-confirm-name" id="delete-confirm-prod-name"></span> ?
      </p>
      <div class="delete-confirm-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-delete">取消</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-delete">確定</button>
      </div>
    </div>
  </div>

  <!-- Enlarged Square Photo Preview Modal (點選九宮格相片時聚焦並放大預覽) -->
  <div id="photo-preview-backdrop" class="context-menu-backdrop hidden" role="dialog" aria-modal="true" aria-label="相片放大預覽">
    <div class="photo-preview-box">
      <img id="photo-preview-img" class="photo-preview-img" src="" alt="相片放大預覽" />
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="/js/vision-engine.js?v=354"></script>
  <script src="/js/app.js?v=354"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>即庫系統</title>
  <meta name="description" content="店家端極速視覺與條碼商品掃描查詢、相機拍照即時建檔系統。" />
  <meta name="theme-color" content="#0b0f14" />
  
  
  <style>
:root{--bg-canvas:hsl(215,28%,7%);--bg-surface:hsl(215,24%,11%);--bg-elevated:hsl(215,22%,15%);--bg-interactive:hsl(215,20%,20%);--text-primary:hsl(210,25%,96%);--text-secondary:hsl(214,15%,74%);--text-muted:hsl(215,14%,54%);--accent-primary:hsl(158,78%,42%);--accent-primary-hover:hsl(158,78%,48%);--accent-primary-soft:hsla(158,78%,42%,0.16);--accent-amber:hsl(38,92%,54%);--accent-amber-soft:hsla(38,92%,54%,0.16);--accent-danger:hsl(352,82%,58%);--accent-danger-soft:hsla(352,82%,58%,0.16);--accent-info:hsl(198,88%,52%);--accent-info-soft:hsla(198,88%,52%,0.16);--border-subtle:hsla(214,20%,82%,0.10);--border-strong:hsla(214,20%,82%,0.18);--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--shadow-card:0 10px 28px -8px rgba(0,0,0,0.55);--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;--font-mono:'JetBrains Mono','SF Mono','Fira Code',ui-monospace,monospace}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background-color:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}.hidden{display:none !important}.mono{font-family:var(--font-mono)}.merchant-workspace{display:grid;grid-template-columns:minmax(340px,1.05fr) minmax(340px,1fr);gap:16px;max-width:1220px;margin:0 auto;padding:14px 16px 32px;align-items:start}.viewport-section{position:sticky;top:14px}@media (max-width:860px){.merchant-workspace{grid-template-columns:1fr;gap:10px;padding:0 0 28px}.viewport-section{position:relative;top:0}.viewport-container{border-radius:0 0 var(--radius-lg) var(--radius-lg) !important;border-top:none !important;border-left:none !important;border-right:none !important}.merchant-main-panel{padding:0 10px}}.viewport-container{position:relative;width:100%;aspect-ratio:4 / 3;background:#05070b;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-strong);box-shadow:var(--shadow-card);user-select:none;contain:layout paint}@supports not (aspect-ratio:4 / 3){.viewport-container::before{content:"";display:block;padding-top:75%}}.viewport-video,.viewport-canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}.viewport-video.mirrored{transform:scaleX(-1)}.hud-overlay{--hud-signal-color:var(--accent-amber);position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px}.hud-overlay.signal-green{--hud-signal-color:var(--accent-primary)}.hud-overlay.signal-amber{--hud-signal-color:var(--accent-amber)}.hud-overlay.signal-red{--hud-signal-color:var(--accent-danger)}.hud-top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status-dot{width:8px;height:8px;border-radius:50%;background:#f59f1f;background:var(--hud-signal-color);display:inline-block;flex-shrink:0;transition:background-color 0.14s ease}.status-dot.active{background:#17bf82;background:var(--hud-signal-color,var(--accent-primary))}.status-dot.eco{background:#f59f1f;background:var(--hud-signal-color,var(--accent-amber))}.status-dot.unregistered{background:#eb3b52;background:var(--hud-signal-color,var(--accent-danger))}.hud-status-badge{pointer-events:none;user-select:none;-webkit-user-select:none;cursor:default;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(10,15,23,0.86);border:1px solid rgba(255,255,255,0.18);color:var(--text-primary);font-size:12px;font-weight:700;transition:background-color 0.14s ease,border-color 0.14s ease}.hud-status-badge.state-active{background:hsla(158,78%,42%,0.26);border-color:var(--accent-primary)}.hud-status-badge.state-standby{background:hsla(38,92%,54%,0.24);border-color:var(--accent-amber)}.hud-status-badge.state-unregistered{background:hsla(352,82%,58%,0.26);border-color:var(--accent-danger)}.hud-icon-btn{pointer-events:auto;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(10,15,23,0.86);border:1px solid rgba(255,255,255,0.20);color:var(--text-primary);cursor:pointer;transition:background-color 0.14s ease,border-color 0.14s ease,color 0.14s ease}.hud-icon-btn:hover{border-color:var(--accent-amber)}.hud-icon-btn.active{background:hsla(38,92%,54%,0.26);border-color:var(--accent-amber);color:var(--accent-amber)}.hud-icon-btn.active .flash-icon{fill:currentColor}.roi-reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58%;height:62%;margin:0;border:1px dashed rgba(255,255,255,0.22);border-radius:12px}.roi-corner{position:absolute;width:22px;height:22px;border-color:#f59f1f;border-color:var(--hud-signal-color);border-style:solid;border-width:0;transition:border-color 0.14s ease}.roi-reticle.state-standby .roi-corner{border-color:#f59f1f;border-color:var(--hud-signal-color,var(--accent-amber))}.roi-reticle.state-active .roi-corner{border-color:#17bf82;border-color:var(--hud-signal-color,var(--accent-primary))}.roi-reticle.state-unregistered .roi-corner{border-color:#eb3b52;border-color:var(--hud-signal-color,var(--accent-danger))}.roi-corner.tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px;border-top-left-radius:8px}.roi-corner.tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px;border-top-right-radius:8px}.roi-corner.bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:8px}.roi-corner.br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:8px}.merchant-main-panel{display:flex;flex-direction:column;gap:10px}.merchant-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md)}.merchant-tab{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--text-secondary);transition:background-color 0.15s ease,color 0.15s ease}.merchant-tab:hover{background:var(--bg-elevated);color:var(--text-primary)}.merchant-tab.active{background:var(--accent-primary);color:#04150e}.tab-icon{flex-shrink:0;display:inline-block}.tab-badge{padding:1px 7px;border-radius:99px;font-size:12px;font-family:var(--font-mono);background:rgba(0,0,0,0.22);color:inherit}.panel{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden}.panel-body{padding:16px}.merchant-card{border-color:hsla(158,78%,42%,0.42)}.unregistered-card{border-color:hsla(38,92%,54%,0.45)}.unreg-title{font-size:24px;font-weight:800;color:var(--accent-amber);letter-spacing:0.02em}.unreg-desc{font-size:13px;color:var(--text-secondary);margin-top:6px}.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}.badge-emerald{background:var(--accent-primary-soft);color:var(--accent-primary);border:1px solid hsla(158,78%,42%,0.32)}.badge-amber{background:var(--accent-amber-soft);color:var(--accent-amber);border:1px solid hsla(38,92%,54%,0.35)}.badge-info{background:var(--accent-info-soft);color:var(--accent-info);border:1px solid hsla(198,88%,52%,0.32)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;transition:all 0.14s ease;text-decoration:none}.btn-sm{padding:6px 10px;font-size:12px}.btn-primary{background:var(--accent-primary);color:#04150e}.btn-primary:hover{background:var(--accent-primary-hover)}.btn-secondary{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-strong)}.btn-secondary:hover{background:var(--bg-interactive)}.btn-danger{background:var(--accent-danger) !important;color:#fff !important;border-color:var(--accent-danger) !important}.rec-header{display:flex;gap:14px;align-items:center}.rec-thumb{width:76px;height:76px;border-radius:var(--radius-md);object-fit:cover;background:var(--bg-canvas);border:1px solid var(--border-strong);flex-shrink:0}.rec-meta{flex:1;min-width:0}.rec-name{font-size:18px;font-weight:800;line-height:1.3;color:var(--text-primary);word-break:break-word}.rec-price{font-size:22px;font-weight:800;color:var(--accent-primary);font-family:var(--font-mono);margin-top:4px}.merchant-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.info-cell{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:9px 11px;min-width:0}.info-label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:2px}.info-val{display:block;font-size:14px;font-weight:700;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stock-inline-row{display:flex;align-items:center;justify-content:space-between;gap:6px}.stock-step-btns{display:inline-flex;gap:4px}.btn-step{width:24px;height:24px;border-radius:5px;background:var(--bg-canvas);border:1px solid var(--border-strong);color:var(--text-primary);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}.btn-step:hover{border-color:var(--accent-primary);color:var(--accent-primary)}.spec-box{margin-top:10px;padding:10px 12px;background:var(--bg-canvas);border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.rec-spec{font-size:13px;color:var(--text-primary);line-height:1.55;white-space:pre-wrap;word-break:break-word}.merchant-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-subtle)}.merchant-card-actions .btn{flex:1;min-width:110px}.reg-capture-bar{display:flex;gap:12px;align-items:center;background:var(--bg-elevated);padding:12px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);margin-bottom:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-field{display:flex;flex-direction:column;gap:4px}.form-field.full{grid-column:1 / -1}.form-label{font-size:12px;font-weight:600;color:var(--text-secondary)}.input-control{width:100%;background:var(--bg-canvas);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;color:var(--text-primary);outline:none;transition:border-color 0.15s ease}.input-control:focus{border-color:var(--accent-primary)}@media (max-width:480px){.form-grid{grid-template-columns:1fr}.merchant-info-grid{grid-template-columns:1fr 1fr}}.toast-stack{position:fixed;bottom:16px;right:16px;left:16px;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}.toast{background:rgba(12,18,28,0.95);color:var(--text-primary);border:1px solid var(--accent-primary);border-radius:var(--radius-md);padding:10px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-card);max-width:460px;width:100%;text-align:center}.toast.warn{border-color:var(--accent-amber)}.toast.danger{border-color:var(--accent-danger)}
</style>
</head>
<body>
  
  <main class="merchant-workspace">
    
    <section class="viewport-section" aria-label="光學取景區">
      <div class="viewport-container" id="viewport-container">
        <video id="camera-video" class="viewport-video hidden" playsinline muted autoplay></video>
        <canvas id="stage-canvas" class="viewport-canvas" width="640" height="480"></canvas>
        
        <div class="hud-overlay signal-amber" id="hud-overlay">
          <div class="hud-top-row">
            <div class="hud-status-badge state-standby" id="hud-live-badge" aria-hidden="true">
              <span class="status-dot eco" id="hud-scan-dot"></span>
              <span id="hud-live-label">待機中</span>
            </div>
            <button type="button" class="hud-icon-btn" id="btn-toggle-torch" title="閃光燈補光" aria-label="閃光燈補光">
              <svg class="flash-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="13 2 4 14 12 14 11 22 20 10 12 10 13 2"></polygon>
              </svg>
            </button>
          </div>
          
          <div class="roi-reticle state-standby" id="roi-reticle">
            <span class="roi-corner tl"></span>
            <span class="roi-corner tr"></span>
            <span class="roi-corner bl"></span>
            <span class="roi-corner br"></span>
          </div>
        </div>
      </div>
    </section>
    
    <section class="merchant-main-panel" aria-label="掃描與庫存區">
      
      <nav class="merchant-tabs" aria-label="店家功能切換">
        <button type="button" class="merchant-tab active" data-tab="scan" id="tab-btn-scan">
          <svg class="tab-icon scan-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>掃描</span>
        </button>
        <button type="button" class="merchant-tab" data-tab="register" id="tab-btn-register">
          <svg class="tab-icon inventory-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16.5 9.4 7.55 4.24"></path>
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.29 7 12 12 20.71 7"></polyline>
            <line x1="12" y1="22" x2="12" y2="12"></line>
          </svg>
          <span>庫存</span>
          <span class="tab-badge" id="nav-inv-count">0</span>
        </button>
      </nav>
      
      <div id="view-scan" class="tab-view">
        
        <div class="panel merchant-card hidden" id="recognized-product-card">
          <div class="panel-body">
            <div class="rec-header">
              <img id="rec-img" class="rec-thumb" src="" alt="商品縮圖" />
              <div class="rec-meta">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
                  <span class="badge badge-emerald" id="rec-match-type">已建檔商品</span>
                  <span class="badge badge-info" id="rec-category">一般商品</span>
                  <span style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono);" id="rec-similarity">99%</span>
                </div>
                <h2 class="rec-name" id="rec-name">--</h2>
                <div class="rec-price" id="rec-price">NT$ 0</div>
              </div>
            </div>
            
            <div class="merchant-info-grid">
              <div class="info-cell">
                <span class="info-label">庫存數量</span>
                <div class="stock-inline-row">
                  <strong class="info-val" id="rec-stock">0 件</strong>
                  <div class="stock-step-btns">
                    <button type="button" class="btn-step" id="btn-rec-stock-minus" title="庫存 -1">−</button>
                    <button type="button" class="btn-step" id="btn-rec-stock-plus" title="庫存 +1">＋</button>
                  </div>
                </div>
              </div>
              <div class="info-cell">
                <span class="info-label">存放儲位</span>
                <strong class="info-val" id="rec-location">--</strong>
              </div>
              <div class="info-cell">
                <span class="info-label">商品編號 (SKU)</span>
                <strong class="info-val mono" id="rec-sku">--</strong>
              </div>
              <div class="info-cell">
                <span class="info-label">國際條碼 / QR</span>
                <strong class="info-val mono" id="rec-barcode">--</strong>
              </div>
            </div>
            
            <div class="spec-box">
              <div class="info-label" style="margin-bottom:4px;">商品介紹 / 規格備註</div>
              <p class="rec-spec" id="rec-spec">--</p>
            </div>
            
            <div class="merchant-card-actions">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-rec-edit">
                ✏️ 編輯建檔資料
              </button>
              <button type="button" class="btn btn-secondary btn-sm" id="btn-train-extra-angle">
                📸 補拍多角度特徵
              </button>
              <button type="button" class="btn btn-secondary btn-sm" id="btn-rec-delete">
                🗑️ 刪除建檔
              </button>
            </div>
          </div>
        </div>
        
        <div class="panel unregistered-card" id="unregistered-prompt-card">
          <div class="panel-body" style="text-align:center; padding:26px 16px;">
            <span class="badge badge-amber" style="font-size:13px; padding:4px 12px; margin-bottom:10px;">⚠️ 查無商品資料</span>
            <h2 class="unreg-title">未建檔</h2>
            <p class="unreg-desc" id="unreg-subtext">目前掃描畫面中的商品尚未建立檔案</p>
            <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px;">
              <button type="button" class="btn btn-primary" id="btn-jump-register">
                📸 擷取目前畫面並建檔
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <div id="view-register" class="tab-view hidden">
        <div class="panel">
          <div class="panel-body">
            
            <div class="reg-capture-bar">
              <img id="reg-preview-img" class="rec-thumb" src="" alt="建檔縮圖預覽" />
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
                  <span class="badge badge-emerald" id="reg-descriptor-status">準備擷取畫面特徵</span>
                  <span style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono);" id="reg-sample-count">樣本: 0 組</span>
                </div>
                <p style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
                  將商品置於上方取景框中央擷取，可補拍 2～3 個不同角度提升辨識精準度。
                </p>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  <button type="button" class="btn btn-primary btn-sm" id="btn-capture-frame">
                    📸 擷取目前鏡頭畫面
                  </button>
                  <button type="button" class="btn btn-secondary btn-sm" id="btn-add-angle-sample">
                    ➕ 補拍角度 (+1)
                  </button>
                </div>
              </div>
            </div>
            
            <form id="register-product-form" class="form-grid" novalidate>
              <input type="hidden" id="reg-id" value="" />
              <div class="form-field full">
                <label class="form-label" for="reg-name">商品名稱 *</label>
                <input type="text" id="reg-name" class="input-control" placeholder="請輸入商品名稱（例如：阿里山高山烏龍茶 150g）" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="reg-price">銷售單價 (NT$) *</label>
                <input type="number" id="reg-price" class="input-control" placeholder="例如：350" value="" min="0" step="1" />
              </div>
              <div class="form-field">
                <label class="form-label" for="reg-stock">庫存數量 *</label>
                <input type="number" id="reg-stock" class="input-control" placeholder="例如：20" value="10" min="0" step="1" />
              </div>
              <div class="form-field">
                <label class="form-label" for="reg-sku">商品編號 (SKU)</label>
                <input type="text" id="reg-sku" class="input-control" placeholder="留空自動編號或手動輸入" />
              </div>
              <div class="form-field">
                <label class="form-label" for="reg-barcode">國際條碼 / QR Code</label>
                <input type="text" id="reg-barcode" class="input-control" placeholder="掃描自動帶入或手動輸入" />
              </div>
              <div class="form-field">
                <label class="form-label" for="reg-category">商品分類</label>
                <input type="text" id="reg-category" class="input-control" placeholder="例如：飲品 / 零食 / 日用品" value="一般商品" />
              </div>
              <div class="form-field">
                <label class="form-label" for="reg-unit">單位 / 存放儲位</label>
                <div style="display:flex; gap:6px;">
                  <input type="text" id="reg-unit" class="input-control" placeholder="單位" value="件" style="width:68px;" />
                  <input type="text" id="reg-location" class="input-control" placeholder="儲位 (如 A-01)" value="A-01" style="flex:1;" />
                </div>
              </div>
              <div class="form-field full">
                <label class="form-label" for="reg-spec">商品介紹 / 規格備註</label>
                <textarea id="reg-spec" class="input-control" rows="2" placeholder="輸入規格、容量、產地、保存期限或店家備註..."></textarea>

            matched: true,
            exactBarcode: true,
            product: matchedProd,
            bestCandidate: matchedProd,
            similarity: 1.0,
            margin: 1.0,
            topCandidates: [{ product: matchedProd, similarity: 1.0 }]
          });
          triggerHaptic(25);
          playTone(1080, 55, 'sine');
        } else {
          state.currentMatch = null;
          state.matchHistory = [null, null];
          updateRecognitionUI(
            {
              matched: false,
              exactBarcode: false,
              product: null,
              bestCandidate: null,
              similarity: 0,
              margin: 0,
              topCandidates: []
            },
            rawCode
          );
          triggerHaptic(45);
          playTone(440, 85, 'sawtooth');
          showToast('⚠️ 條碼「' + rawCode + '」未建檔', 'warn');
        }
      }
    });
    window.addEventListener('online', function () {
      flushOutboxToServer();
    });
    document.addEventListener('visibilitychange', async function () {
      if (document.hidden) {
        cancelScheduledRecognition();
        clearBgCameraReleaseTimer();
        updateHudCameraStatus();
        if (state.sourceMode === 'webcam' && state.mediaStream) {
          bgCameraReleaseTimer = setTimeout(function () {
            bgCameraReleaseTimer = null;
            if (document.hidden && state.sourceMode === 'webcam' && state.mediaStream) {
              stopWebcamStream();
              state.autoPausedWebcamInBg = true;
              state.torchOn = false;
              if (el['btn-toggle-torch']) el['btn-toggle-torch'].classList.remove('active');
              renderStageCanvasFrame();
              updateHudCameraStatus();
            }
          }, BG_CAMERA_RELEASE_MS);
        }
      } else {
        clearBgCameraReleaseTimer();
        if (state.autoPausedWebcamInBg && state.sourceMode === 'webcam') {
          state.autoPausedWebcamInBg = false;
          await startWebcamStream(true);
        }
        VisionEngine.resetMotionGate();
        scheduleRecognition(true);
      }
    });
    if (navigator && typeof navigator.getBattery === 'function') {
      navigator
        .getBattery()
        .then(function (battery) {
          var syncBatteryState = function () {
            state.lowBatteryMode = !battery.charging && battery.level <= 0.20;
            updateHudCameraStatus();
          };
          syncBatteryState();
          battery.addEventListener('levelchange', syncBatteryState);
          battery.addEventListener('chargingchange', syncBatteryState);
        })
        .catch(function () {});
    }
  }
  window.addEventListener('DOMContentLoaded', async function () {
    bindElements();
    setupEvents();
    renderStageCanvasFrame();
    await initDataStore();
    if (
      'serviceWorker' in navigator &&
      (window.location.protocol === 'http:' || window.location.protocol === 'https:') &&
      window.location.hostname !== 'visionpos.local'
    ) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
    await startWebcamStream(true);
  });
})();
</script>
</body>
</html>
